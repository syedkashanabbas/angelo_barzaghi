<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optimo</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="antialiased text-gray-900">
<!-- HEADER -->
<header class="absolute top-6 left-0 w-full z-30">
  <div class="max-w-[96%] mx-auto">
    <div class="bg-white rounded-full px-10 h-[72px] flex items-center justify-between shadow-md">
      
      <div class="font-extrabold text-blue-700 text-[22px] tracking-wide">
        OPTIMO
      </div>

      <nav class="hidden md:flex items-center gap-10 text-gray-600 font-medium text-[15px]">
        <a href="#" class="hover:text-black">Home</a>
        <a href="#" class="hover:text-black">About Us</a>
        <a href="#" class="hover:text-black">Services</a>
        <a href="#" class="hover:text-black">Blog</a>
        <a href="#" class="hover:text-black">Pricing</a>
        <a href="#" class="hover:text-black">Pages</a>
      </nav>

      <a href="#" class="flex items-center gap-2 bg-blue-600 text-white px-5 py-2 rounded-full text-[14px] font-semibold">
        Contact Us
        <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-sm">
          →
        </span>
      </a>

    </div>
  </div>
</header>


<!-- HERO -->
<section
  class="relative min-h-screen"
  style="background-image:url('https://images.pexels.com/photos/7693756/pexels-photo-7693756.jpeg'); background-size:cover; background-position:center;"
>
  <!-- dark overlay -->
  <div class="absolute inset-0 bg-black/35"></div>

  <!-- hero content -->
  <div class="relative z-10 max-w-7xl mx-auto px-8 h-screen flex items-center">
    <div class="max-w-3xl text-white mt-24">
      
      <h1 class="text-5xl md:text-6xl font-extrabold leading-tight">
        Navigate Business
        <br>
        <span class="italic font-light">with Confidence</span>
      </h1>

      <p class="mt-6 text-lg text-gray-200 max-w-xl">
        Expert strategic consulting to drive sustainable growth, operational
        innovation, and lasting business transformation across industries and
        markets, maximizing impact.
      </p>

      <div class="mt-10">
        <a href="#" class="inline-flex items-center gap-4 bg-white text-blue-700 px-7 py-3 rounded-full font-semibold">
          Book a Free Call
          <span class="bg-blue-600 text-white w-9 h-9 rounded-full flex items-center justify-center">
            →
          </span>
        </a>
      </div>

    </div>
  </div>
</section>

</body>
</html>
